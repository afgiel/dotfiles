# ~/.tmux.conf

# ---- prefix ----
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind C-a last-window
bind s choose-tree -Zw

# ---- general ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# windows/panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# quiet
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ---- bindings (carried over from screenrc) ----
# 0 jumps to window 10
bind 0 select-window -t :10

# space focuses next pane
bind Space select-pane -t :.+

# nicer splits that keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- status bar ----
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=black,fg=white"

set -g status-left ""
set -g status-left-length 0

setw -g window-status-format         "#[bg=blue,fg=white] #I #W "
setw -g window-status-current-format "#[bg=colour39,fg=black,bold] #I #W "
setw -g window-status-separator ""

set -g status-right "#[bg=green,fg=black] #H #[bg=yellow,fg=black] %m/%d %H:%M "
set -g status-right-length 60

# ---- pane borders ----
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"

# ---- active vs inactive window style ----
set -g window-style "fg=colour245,bg=default"
set -g window-active-style "fg=white,bg=default"
setw -g window-status-current-format "#[bg=colour39,fg=black,bold] #I #W #[fg=red]●#[fg=black] "

# ---- pane navigation ----
# vim-style with smart fallback: j/k wrap to horizontal when at edge
bind h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind j if -F '#{pane_at_bottom}' 'select-pane -R' 'select-pane -D'
bind k if -F '#{pane_at_top}'    'select-pane -L' 'select-pane -U'
bind l if -F '#{pane_at_right}'  '' 'select-pane -R'

# quick toggle between current and last pane
bind \; last-pane

# resize panes (repeatable — hold prefix, tap to keep resizing)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
